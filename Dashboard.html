<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f1216">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>TV Dashboard - Bakım Yönetim</title>
  <link rel="manifest" href="<?= url ?>?page=manifest">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #0f1216;
      color: #e2e6ea;
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
      overflow-x: auto;
    }
    .dashboard {
      padding: 1.5rem 2rem;
      max-width: 1600px;
      margin: 0 auto;
    }
    h1 {
      font-size: clamp(1.5rem, 4vw, 2.25rem);
      font-weight: 700;
      margin: 0 0 1rem 0;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .clock {
      font-size: clamp(1.25rem, 3vw, 1.75rem);
      color: #8b949e;
      font-weight: 400;
      margin-left: auto;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: clamp(0.95rem, 2.2vw, 1.35rem);
      table-layout: fixed;
    }
    th, td {
      padding: clamp(0.6rem, 1.5vw, 1rem) clamp(0.75rem, 2vw, 1.25rem);
      text-align: left;
      border-bottom: 1px solid #21262d;
    }
    th {
      background: #161b22;
      color: #8b949e;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }
    tr:hover {
      background: rgba(255,255,255,0.02);
    }
    .row-normal {
      background: rgba(13, 110, 253, 0.12);
    }
    .row-urgent {
      background: rgba(255, 193, 7, 0.18);
    }
    .row-very-urgent {
      background: rgba(220, 53, 69, 0.22);
      animation: blink-bg 1.2s ease-in-out infinite;
    }
    @keyframes blink-bg {
      0%, 100% { background: rgba(220, 53, 69, 0.22); }
      50% { background: rgba(220, 53, 69, 0.45); }
    }
    .badge {
      display: inline-block;
      padding: 0.25em 0.6em;
      border-radius: 0.35rem;
      font-size: 0.85em;
      font-weight: 600;
    }
    .badge-normal { background: #0d6efd; color: #fff; }
    .badge-urgent { background: #ffc107; color: #000; }
    .badge-very-urgent { background: #dc3545; color: #fff; }
    .empty-state {
      text-align: center;
      padding: 3rem 1rem;
      color: #8b949e;
      font-size: clamp(1rem, 2.5vw, 1.25rem);
    }
    .loading {
      text-align: center;
      padding: 3rem 1rem;
      color: #8b949e;
    }
    .error {
      text-align: center;
      padding: 2rem;
      color: #f85149;
    }
    @media (max-width: 768px) {
      .dashboard { padding: 1rem; }
      th:nth-child(n+4), td:nth-child(n+4) { font-size: 0.9em; }
    }
  </style>
</head>
<body>
  <div class="dashboard">
    <h1>
      <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" fill="currentColor" viewBox="0 0 16 16"><path d="M4 2a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v1.5a.5.5 0 0 1-.5.5H4.5A.5.5 0 0 1 4 3.5V2zm1 2v10a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2V4H5zm2 1a.5.5 0 0 1 .5-.5h5a.5.5 0 0 1 .5.5v1a.5.5 0 0 1-.5.5h-5a.5.5 0 0 1-.5-.5V7z"/></svg>
      Aktif Arızalar
      <span class="clock" id="clock"></span>
    </h1>
    <div id="content">
      <div class="loading">Veriler yükleniyor...</div>
    </div>
  </div>

  <script>
    (function() {
      'use strict';

      var REFRESH_MS = 30000; // 30 saniye
      var contentEl = document.getElementById('content');
      var clockEl = document.getElementById('clock');

      function formatTurkeyTime() {
        var now = new Date();
        var utc = now.getTime() + (now.getTimezoneOffset() * 60000);
        var turkey = new Date(utc + (3 * 60 * 60 * 1000));
        var pad = function(n) { return n < 10 ? '0' + n : n; };
        return pad(turkey.getHours()) + ':' + pad(turkey.getMinutes()) + ':' + pad(turkey.getSeconds()) + ' (UTC+3)';
      }

      function updateClock() {
        if (clockEl) clockEl.textContent = formatTurkeyTime();
      }

      function getPriorityClass(oncelik) {
        if (oncelik === 'Çok Acil') return 'row-very-urgent';
        if (oncelik === 'Acil') return 'row-urgent';
        return 'row-normal';
      }

      function getBadgeClass(oncelik) {
        if (oncelik === 'Çok Acil') return 'badge-very-urgent';
        if (oncelik === 'Acil') return 'badge-urgent';
        return 'badge-normal';
      }

      function render(list) {
        if (!list || list.length === 0) {
          contentEl.innerHTML = '<div class="empty-state">Aktif arıza kaydı yok.</div>';
          return;
        }
        var html = '<table><thead><tr>' +
          '<th style="width:10%">Saat</th>' +
          '<th style="width:18%">Raporlayan</th>' +
          '<th style="width:15%">Bölüm</th>' +
          '<th style="width:14%">Tezgah Kodu</th>' +
          '<th style="width:18%">Atanan Personel</th>' +
          '<th style="width:15%">Durum</th>' +
          '</tr></thead><tbody>';
        list.forEach(function(f) {
          var saat = (f.tarihSaat || '').slice(11, 19) || '-';
          var raporlayan = ((f.raporlayanAd || '') + ' ' + (f.raporlayanSoyad || '')).trim() || '-';
          var bolum = f.bolum || '-';
          var tezgah = f.tezgahKodu || '-';
          var atanan = f.atananPersonel || '-';
          var durum = f.durum || '-';
          var rowClass = getPriorityClass(f.oncelik || 'Normal');
          var badgeClass = getBadgeClass(f.oncelik || 'Normal');
          html += '<tr class="' + rowClass + '">' +
            '<td>' + saat + '</td>' +
            '<td>' + raporlayan + '</td>' +
            '<td>' + bolum + '</td>' +
            '<td>' + tezgah + '</td>' +
            '<td>' + atanan + '</td>' +
            '<td><span class="badge ' + badgeClass + '">' + durum + '</span></td>' +
            '</tr>';
        });
        html += '</tbody></table>';
        contentEl.innerHTML = html;
      }

      function fetchData() {
        if (typeof google === 'undefined' || !google.script || !google.script.run) {
          contentEl.innerHTML = '<div class="error">Google Apps Script ortamı gerekli.</div>';
          return;
        }
        google.script.run
          .withSuccessFunction(function(list) {
            if (list && list._error) {
              contentEl.innerHTML = '<div class="error">' + list._error + '</div>';
              return;
            }
            if (!Array.isArray(list)) list = [];
            render(list);
          })
          .withFailureFunction(function(err) {
            contentEl.innerHTML = '<div class="error">Veri alınamadı: ' + (err && err.message ? err.message : 'Hata') + '</div>';
          })
          .getActiveFaults();
      }

      updateClock();
      setInterval(updateClock, 1000);
      fetchData();
      setInterval(fetchData, REFRESH_MS);
    })();
  </script>
</body>
</html>
